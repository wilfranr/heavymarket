<div class="flex flex-col gap-3">
    @if (label) {
    <div class="flex items-center gap-3">
        @if (icon) {
        <div class="w-8 h-8 rounded-full bg-[#fdb831]/10 flex items-center justify-center text-[#fdb831]">
            <i [class]="icon + ' text-sm'"></i>
        </div>
        }
        <h3 class="text-xs font-black text-gray-400 tracking-widest uppercase">{{ label }}</h3>
    </div>
    }

    <div (click)="triggerFileInput()" (drop)="onFileDropped($event)" (dragover)="onDragOver($event)"
        class="bg-[#0c0c0e] border-2 border-dashed border-white/5 rounded-2xl flex flex-col items-center justify-center gap-4 group cursor-pointer hover:border-[#fdb831]/50 hover:bg-[#fdb831]/5 transition-all overflow-hidden relative"
        [ngStyle]="{ height: height }">

        <input type="file" #fileInput (change)="onFileSelected($event)" [accept]="accept" class="hidden" />

        <div class="flex flex-col items-center p-4 w-full h-full justify-center">
            @if (previewUrl) {
            <img [src]="previewUrl" class="max-h-full max-w-full object-contain rounded-lg shadow-xl" />
            <div
                class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                <span class="text-xs font-bold text-white uppercase tracking-wider">Cambiar imagen</span>
            </div>
            } @else {
            <div
                class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                <i class="pi pi-upload text-gray-600 group-hover:text-[#fdb831]"></i>
            </div>
            <p class="text-[11px] text-gray-500 text-center">
                Arrastra y suelta o <span class="text-[#fdb831] font-bold">Examina</span>
            </p>
            }
        </div>
    </div>
</div>
