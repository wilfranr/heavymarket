<div class="flex flex-col gap-3">
    @if (label) {
        <div class="flex items-center gap-3">
            @if (icon) {
                <div class="w-8 h-8 rounded-full bg-[#fdb831]/10 flex items-center justify-center text-[#fdb831]">
                    <i [class]="icon + ' text-sm'"></i>
                </div>
            }
            <h3 class="text-xs font-black text-[#fdb831] tracking-widest uppercase">{{ label }}</h3>
        </div>
    }

    <div
        (click)="triggerFileInput()"
        (drop)="onFileDropped($event)"
        (dragover)="onDragOver($event)"
        class="surface-section border-2 border-dashed border-surface-border rounded-2xl flex flex-col items-center justify-center gap-4 group cursor-pointer hover:border-[#fdb831]/50 hover:bg-[#fdb831]/5 transition-all overflow-hidden relative"
        [ngStyle]="{ height: height }"
    >
        <input type="file" #fileInput (change)="onFileSelected($event)" [accept]="accept" class="hidden" />

        <div class="flex flex-col items-center p-4 w-full h-full justify-center">
            @if (previewUrl) {
                <img [src]="previewUrl" class="max-h-full max-w-full object-contain rounded-lg shadow-xl" />

                <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center gap-4 transition-all duration-300">
                    <p-button icon="pi pi-search-plus" [rounded]="true" severity="secondary" pTooltip="Ver más grande" tooltipPosition="top" (onClick)="$event.stopPropagation(); abrirZoom()"></p-button>
                    <p-button icon="pi pi-upload" [rounded]="true" severity="warn" pTooltip="Cambiar imagen" tooltipPosition="top" (onClick)="$event.stopPropagation(); triggerFileInput()"></p-button>
                </div>
            } @else {
                <div class="w-12 h-12 rounded-xl surface-50 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                    <i class="pi pi-upload text-color-secondary group-hover:text-[#fdb831]"></i>
                </div>
                <p class="text-[11px] text-color-secondary text-center">Arrastra y suelta o <span class="text-[#fdb831] font-bold">Examina</span></p>
            }
        </div>
    </div>
</div>

<!-- Diálogo de Zoom -->
<p-dialog [(visible)]="showZoom" [header]="label" [modal]="true" [maximizable]="true" [style]="{ width: '90vw', height: '90vh' }" appendTo="body" styleClass="p-fluid zoom-dialog">
    <div class="w-full h-full flex items-center justify-center bg-black/5 p-4 rounded-2xl overflow-auto">
        <img [src]="previewUrl" class="max-w-full max-h-full object-contain shadow-2xl rounded-lg" />
    </div>
    <ng-template pTemplate="footer">
        <p-button label="Cerrar" icon="pi pi-times" [text]="true" (onClick)="showZoom = false"></p-button>
    </ng-template>
</p-dialog>
