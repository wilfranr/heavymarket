<div class="figma-card p-0 overflow-hidden flex flex-col flex-1 min-h-[320px] bg-white dark:bg-[var(--p-content-background)] rounded-lg shadow-md border border-gray-200 dark:border-[var(--p-content-border-color)]">
    <div class="p-3 bg-gray-50 dark:bg-[var(--p-content-background)] flex justify-between items-center border-b border-gray-200 dark:border-[var(--p-content-border-color)]">
        <span class="font-bold text-gray-800 dark:text-white text-base pl-2">Información del pedido</span>
        <div class="w-[47px] h-[44px] flex items-center justify-center">
            <i class="pi pi-shopping-bag text-gray-600 dark:text-white text-xl"></i>
        </div>
    </div>
    <div class="p-4 space-y-2 flex-1 text-sm bg-white dark:bg-[var(--p-content-background)] overflow-y-auto">
        <div class="flex items-center gap-2">
            <span class="text-brand-yellow font-semibold">Pedido:</span>
            <span class="text-gray-800 dark:text-gray-100">{{ consecutivoFinal() }}</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-brand-yellow font-semibold">Creación:</span>
            <span class="text-gray-800 dark:text-gray-100">{{ pedido()?.created_at | date: 'MMMM d, y' }}</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-brand-yellow font-semibold">Actualización:</span>
            <span class="text-gray-800 dark:text-gray-100">{{ pedido()?.updated_at | date: 'MMMM d, y' }}</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-brand-yellow font-semibold">Vendedor:</span>
            <span class="text-gray-800 dark:text-gray-100">{{ pedido()?.user?.name || '---' }}</span>
        </div>
        <div class="flex items-center gap-2 mt-2">
            <span class="text-brand-yellow font-semibold">Estado:</span>
            <p-tag [value]="etiquetaEstado(estadoFinal())" [styleClass]="'text-xs px-3 py-1 rounded-full ' + claseEstado(estadoFinal())"></p-tag>
        </div>

        @if (comentariosCount() > 0) {
            <div class="mt-3 pt-2 border-t border-gray-100 dark:border-gray-700">
                <p-button [label]="'Comentarios previos (' + comentariosCount() + ')'" icon="pi pi-comments" styleClass="text-sm" [text]="true" (onClick)="openComments.emit()"></p-button>
            </div>
        }
    </div>
</div>
