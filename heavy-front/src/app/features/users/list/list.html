<div class="grid">
    <div class="col-12">
        <div class="card">
            <h4>Gestión de Usuarios</h4>
            <p-toast></p-toast>
            <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

            <ng-container *ngIf="users$ | async as users">
                <p-table #dt [value]="users" [loading]="(loading$ | async)!" 
                         [paginator]="true" [rows]="rowsPerPage" [totalRecords]="(total$ | async)!" 
                         [lazy]="true" (onLazyLoad)="onPageChange($event)" [first]="first"
                         [rowsPerPageOptions]="[10,15,30]" responsiveLayout="scroll">
                    <ng-template pTemplate="caption">
                        <div class="flex justify-content-between flex-column sm:flex-row">
                            <button pButton label="Nuevo Usuario" icon="pi pi-plus" class="p-button-success mb-2" (click)="openNew()"></button>
                            <p-iconField iconPosition="left">
                                <p-inputIcon class="pi pi-search"></p-inputIcon>
                                <input pInputText type="text" placeholder="Buscar por Nombre/Email..." (input)="onGlobalFilter($event)" class="w-full" />
                            </p-iconField>
                        </div>
                    </ng-template>

                    <ng-template pTemplate="header">
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Fecha Registro</th>
                            <th style="width: 15rem">Acciones</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-usr>
                        <tr>
                            <td>{{usr.name}}</td>
                            <td>{{usr.email}}</td>
                            <td>
                                <span *ngIf="!usr.roles || usr.roles.length === 0" class="text-500">Sin roles</span>
                                <div class="flex gap-1 flex-wrap">
                                    <p-tag *ngFor="let rol of usr.roles" [value]="$any(rol).name || rol" [severity]="getSeverity($any(rol).name || rol)"></p-tag>
                                </div>
                            </td>
                            <td>{{usr.created_at | date:'dd/MM/yyyy HH:mm'}}</td>
                            <td>
                                <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editUser(usr)"></button>
                                <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="deleteUser(usr)"></button>
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="emptymessage">
                        <tr>
                            <td colspan="5" class="text-center p-4">No se encontraron usuarios.</td>
                        </tr>
                    </ng-template>
                </p-table>
            </ng-container>

            <p-dialog [(visible)]="userDialog" [style]="{width: '500px'}" [header]="dialogTitle" [modal]="true" class="p-fluid">
                <ng-template pTemplate="content">
                    <div class="field">
                        <label for="name">Nombre</label>
                        <input type="text" pInputText id="name" [(ngModel)]="user.name" required autofocus />
                        <small class="p-error" *ngIf="!user.name">El nombre es obligatorio.</small>
                    </div>
                    <div class="field">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" pInputText id="email" [(ngModel)]="user.email" required />
                        <small class="p-error" *ngIf="!user.email">El correo electrónico es obligatorio.</small>
                    </div>
                    <div class="field">
                        <label for="password">Contraseña <span *ngIf="user.id" class="text-600 font-normal">(Dejar en blanco para no cambiarla)</span></label>
                        <p-password [(ngModel)]="user.password" [toggleMask]="true" promptLabel="Introduce una contraseña" weakLabel="Débil" mediumLabel="Media" strongLabel="Fuerte"></p-password>
                        <small class="p-error" *ngIf="!user.id && !user.password">La contraseña es obligatoria para un usuario nuevo.</small>
                    </div>
                    <div class="field">
                        <label for="roles">Asignar Roles</label>
                        <p-multiSelect [options]="availableRoles" [(ngModel)]="user.currentRoles" defaultLabel="Seleccione los Roles" optionLabel="label" optionValue="value" display="chip"></p-multiSelect>
                    </div>
                </ng-template>

                <ng-template pTemplate="footer">
                    <button pButton label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
                    <button pButton label="Guardar" icon="pi pi-check" class="p-button-text" (click)="saveUser()"></button>
                </ng-template>
            </p-dialog>
        </div>
    </div>
</div>
