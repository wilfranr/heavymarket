<p-toast />
<p-confirmDialog />

<div class="container mx-auto p-4">
    <p-card>
        <ng-template pTemplate="header">
            <div class="flex justify-between items-center p-4">
                <h2 class="text-2xl font-bold">Gestión de Usuarios</h2>
                <p-button label="Nuevo Usuario" icon="pi pi-plus" (onClick)="openNew()"></p-button>
            </div>
        </ng-template>

        <ng-container *ngIf="users$ | async as users">
            <p-table #dt [value]="users" [loading]="(loading$ | async)!" 
                     [paginator]="true" [rows]="rowsPerPage" [totalRecords]="(total$ | async)!" 
                     [lazy]="true" (onLazyLoad)="onPageChange($event)" [first]="first"
                     [showCurrentPageReport]="true"
                     currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuarios"
                     [rowsPerPageOptions]="[10,15,30]" responsiveLayout="scroll"
                     styleClass="p-datatable-sm">
                
                <ng-template pTemplate="caption">
                    <div class="flex">
                        <p-iconField iconPosition="left" class="w-full">
                            <p-inputIcon class="pi pi-search"></p-inputIcon>
                            <input pInputText type="text" placeholder="Buscar por Nombre/Email..." (input)="onGlobalFilter($event)" class="w-full" />
                        </p-iconField>
                    </div>
                </ng-template>

                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
                        <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
                        <th>Roles</th>
                        <th pSortableColumn="created_at">Fecha Registro <p-sortIcon field="created_at"></p-sortIcon></th>
                        <th>Acciones</th>
                    </tr>
                </ng-template>
                
                <ng-template pTemplate="body" let-usr>
                    <tr>
                        <td>
                            <span class="font-semibold">{{usr.name}}</span>
                        </td>
                        <td>
                            <span class="text-sm">
                                <i class="pi pi-envelope mr-1"></i>{{usr.email}}
                            </span>
                        </td>
                        <td>
                            <span *ngIf="!usr.roles || usr.roles.length === 0" class="text-500">Sin roles</span>
                            <div class="flex gap-1 flex-wrap">
                                <p-tag *ngFor="let rol of usr.roles" [value]="$any(rol).name || rol" [severity]="getSeverity($any(rol).name || rol)"></p-tag>
                            </div>
                        </td>
                        <td><span class="text-sm">{{usr.created_at | date:'dd/MM/yyyy HH:mm'}}</span></td>
                        <td>
                            <div class="flex gap-2">
                                <p-button icon="pi pi-pencil" severity="warn" [text]="true" [rounded]="true" (onClick)="editUser(usr)" pTooltip="Editar" tooltipPosition="top"></p-button>
                                <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" (onClick)="deleteUser(usr)" pTooltip="Eliminar" tooltipPosition="top"></p-button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center py-8">
                            <i class="pi pi-inbox text-4xl text-gray-400 mb-2"></i>
                            <p class="text-gray-600">No se encontraron usuarios.</p>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </ng-container>
    </p-card>
</div>

            <p-dialog [(visible)]="userDialog" [style]="{width: '500px'}" [header]="dialogTitle" [modal]="true">
                <ng-template pTemplate="content">
                    <div class="flex flex-col gap-4 mt-2">
                        <div class="flex flex-col gap-2">
                            <label for="name" class="font-semibold">Nombre</label>
                            <input pInputText id="name" [(ngModel)]="user.name" required autofocus class="w-full" />
                            <small class="text-red-500" *ngIf="!user.name">El nombre es obligatorio.</small>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label for="email" class="font-semibold">Correo Electrónico</label>
                            <input pInputText type="email" id="email" [(ngModel)]="user.email" required class="w-full" />
                            <small class="text-red-500" *ngIf="!user.email">El correo electrónico es obligatorio.</small>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label for="password" class="font-semibold">Contraseña 
                                <span *ngIf="user.id" class="text-gray-400 font-normal text-sm ml-1">(Dejar en blanco para no cambiarla)</span>
                            </label>
                            <p-password [(ngModel)]="user.password" [toggleMask]="true" promptLabel="Introduce una contraseña" weakLabel="Débil" mediumLabel="Media" strongLabel="Fuerte" styleClass="w-full" inputStyleClass="w-full"></p-password>
                            <small class="text-red-500" *ngIf="!user.id && !user.password">La contraseña es obligatoria para un usuario nuevo.</small>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label for="roles" class="font-semibold">Asignar Roles</label>
                            <p-multiSelect [options]="availableRoles" [(ngModel)]="user.currentRoles" defaultLabel="Seleccione los Roles" optionLabel="label" optionValue="value" display="chip" styleClass="w-full"></p-multiSelect>
                        </div>
                    </div>
                </ng-template>

                <ng-template pTemplate="footer">
                    <div class="flex justify-end gap-2 pt-2">
                        <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="hideDialog()"></p-button>
                        <p-button label="Guardar" icon="pi pi-check" [text]="true" severity="success" (onClick)="saveUser()"></p-button>
                    </div>
                </ng-template>
            </p-dialog>
