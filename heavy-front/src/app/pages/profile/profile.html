<div class="flex flex-col md:flex-row gap-8">
    <div class="w-full">
        <p-toast></p-toast>
        <div class="card">
            <div class="font-semibold text-xl mb-4 text-primary">Mi Perfil</div>
            <p class="text-muted-color mb-6">Actualiza tu información personal y contraseña.</p>

            <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
                <div class="grid grid-cols-12 gap-4">
                    <div class="col-span-12 md:col-span-6">
                        <label for="name" class="block font-bold mb-2">Nombre Completo</label>
                        <input pInputText id="name" formControlName="name" class="w-full" placeholder="Ingresa tu nombre" />
                        <small *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched" class="text-red-500 block mt-1">
                            El nombre es obligatorio (mínimo 3 caracteres).
                        </small>
                    </div>

                    <div class="col-span-12 md:col-span-6">
                        <label for="email" class="block font-bold mb-2">Correo Electrónico</label>
                        <input pInputText id="email" formControlName="email" class="w-full" placeholder="ejemplo@correo.com" />
                        <small *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="text-red-500 block mt-1">
                            Ingresa un correo electrónico válido.
                        </small>
                    </div>
                </div>

                <div class="divider border-t border-surface-200 dark:border-surface-700 my-4"></div>
                <div class="font-semibold text-lg mb-2">Cambiar Contraseña</div>
                <p class="text-sm text-muted-color mb-4">Deja en blanco si no deseas cambiarla.</p>

                <div class="grid grid-cols-12 gap-4">
                    <div class="col-span-12 md:col-span-6">
                        <label for="password" class="block font-bold mb-2">Nueva Contraseña</label>
                        <p-password id="password" formControlName="password" [toggleMask]="true" [feedback]="true" styleClass="w-full" inputStyleClass="w-full" promptLabel="Ingresa contraseña" weakLabel="Débil" mediumLabel="Media" strongLabel="Fuerte"></p-password>
                        <small *ngIf="profileForm.get('password')?.invalid && profileForm.get('password')?.touched" class="text-red-500 block mt-1">
                            La contraseña debe tener al menos 8 caracteres.
                        </small>
                    </div>

                    <div class="col-span-12 md:col-span-6">
                        <label for="password_confirmation" class="block font-bold mb-2">Confirmar Contraseña</label>
                        <p-password id="password_confirmation" formControlName="password_confirmation" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"></p-password>
                        <small *ngIf="profileForm.errors?.['mismatch'] && profileForm.get('password_confirmation')?.touched" class="text-red-500 block mt-1">
                            Las contraseñas no coinciden.
                        </small>
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-4">
                    <p-button label="Guardar Cambios" icon="pi pi-check" type="submit" [loading]="loading" [disabled]="profileForm.invalid || loading"></p-button>
                </div>
            </form>
        </div>
    </div>
</div>
