<div class="hm-brands-section">
    <div class="hm-brands-marquee">
        <div class="hm-brands-track">
            @for (brand of marqueeBrands(); track $index) {
            <div class="hm-brands-card">
                <div class="hm-brands-img-wrap">
                    <img [src]="brand.logo" [alt]="brand.nombre" loading="lazy" decoding="async" class="hm-brands-img" />
                </div>
            </div>
            }
        </div>
    </div>
</div>
