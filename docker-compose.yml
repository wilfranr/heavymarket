services:
  # Backend Laravel API
  api:
    build:
      context: ./heavy-api
    container_name: heavymarket-api
    working_dir: /var/www
    volumes:
      - ./heavy-api:/var/www
    network_mode: host
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  # Frontend Angular
  frontend:
    image: node:20-alpine
    container_name: heavymarket-frontend
    working_dir: /app
    volumes:
      - ./heavy-front:/app
      - /app/node_modules
      - /app/.angular
    network_mode: host
    command: sh -c "rm -rf .angular/cache && npm install && npm start -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development

  # MySQL para entornos sin base de datos nativa (ej. servidor de desarrollo).
  # Opt-in via COMPOSE_PROFILES=server para no chocar con el MySQL nativo del laptop (puerto 3306).
  mysql:
    image: mysql:8.0
    container_name: heavymarket-mysql
    restart: unless-stopped
    profiles:
      - server
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-heavymarket}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-heavymarket}
      MYSQL_USER: ${MYSQL_USER:-heavymarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-heavymarket}
    ports:
      - "3306:3306"
    volumes:
      - heavymarket_mysql_data:/var/lib/mysql

  # phpMyAdmin para administrar la BD local
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: heavymarket-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Mailhog para desarrollo (servidor SMTP de prueba)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: heavymarket-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  heavymarket_mysql_data:
